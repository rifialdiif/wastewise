services:
  - name: wastewise
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: GEMINI_API_KEY
        sync: false # entered in the Render dashboard, never committed
      - key: CORS_ORIGINS
        sync: false # e.g. https://your-site.com (comma-separated)
